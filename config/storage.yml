test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

local:
  service: Disk
  root: <%= Rails.root.join("storage") %>

# Production. Heroku dynos do not share a disk and lose it on restart, and the worker writes the
# export that the web dyno serves, so the file has to live in a bucket. Config vars, not
# credentials, so the Heroku app owns them.
amazon:
  service: S3
  access_key_id: <%= ENV["AWS_ACCESS_KEY_ID"] %>
  secret_access_key: <%= ENV["AWS_SECRET_ACCESS_KEY"] %>
  region: <%= ENV.fetch("AWS_REGION", "eu-west-2") %>
  bucket: <%= ENV["AWS_BUCKET"] %>
