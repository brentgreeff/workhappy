default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

local: &local
  <<: *default
  host: localhost
  port: 5434
  username: workhappy
  password: password
  # libpq's default gssencmode=prefer asks macOS Kerberos for a credential cache over XPC
  # before each TCP connection; a forked child inherits a dead XPC port and segfaults on it
  # (ged/ruby-pg#767). Solid Queue's workers are forks of a fork, so local only.
  gssencmode: disable

development:
  <<: *local
  database: workhappy_development

test:
  <<: *local
  database: workhappy_test

# Heroku-style: DATABASE_URL merges over this block. One database for the app and the
# Solid Queue/Cache/Cable tables; see db/migrate/*_create_solid_tables.rb.
production:
  <<: *default
  database: workhappy_production
  username: workhappy
  password: <%= ENV["WORKHAPPY_DATABASE_PASSWORD"] %>
