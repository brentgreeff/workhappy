# Pre-commit gate — mirrors CI (rubocop, tsc, security scans).
# Install once (after `bundle install`):  bundle exec lefthook install
# Skip for a single commit:               LEFTHOOK=0 git commit
#
# Requires binstubs: bin/rubocop, bin/brakeman, bin/bundler-audit; and node_modules (npm install)

pre-commit:
  parallel: true
  commands:
    rubocop:
      tags: backend style
      glob: "*.rb"
      exclude: '(^db/)|(^bin/)|(^vendor/)|(^node_modules/)'
      run: bin/rubocop --force-exclusion {staged_files}
    typecheck:
      tags: frontend types
      glob: "*.ts"
      run: npm run typecheck
    brakeman:
      tags: security
      run: bin/brakeman -q --no-pager --no-summary
    bundler-audit:
      tags: security
      run: bin/bundler-audit check --update
    npm-audit:
      tags: security
      run: npm audit --audit-level=high
